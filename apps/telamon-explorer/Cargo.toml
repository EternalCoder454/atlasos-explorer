[package]
name = "telamon-explorer"
description = "Telamon Explorer: the file manager of Telamon OS (Kirigami UI over CXX-Qt, KIO through C++)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version.workspace = true
build = "build.rs"

# CMake (Corrosion) links the static library into the C++ executable.
# `rlib` is there so `cargo test` and `cargo clippy` work as usual.
[lib]
name = "telamon_explorer"
crate-type = ["staticlib", "rlib"]

[dependencies]
telamon-framework-ui.workspace = true
atlas-explorer-core = { path = "../../crates/atlas-explorer-core" }
atlas-file-index = { path = "../../crates/atlas-file-index" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
log.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"
