[workspace]
resolver = "3"
members = [
    "crates/atlas-explorer-core",
    "crates/atlas-file-index",
    "apps/telamon-explorer",
    "apps/telamon-explorer-indexd",
    "apps/telamon-explorer-search",
    "tests/archive-standin",
    "tests/avahi-standin",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-explorer"
rust-version = "1.89"

[workspace.dependencies]
# The atlas-framework crates (startup, settings, logging, crash reports); to
# move the pin, see CLAUDE.md. Telamon.Ui is not pinned here: it is the
# installed telamon-ui package.
telamon-framework-ui = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.0" }
log = { version = "0.4", features = ["std"] }
libc = "0.2"
# The D-Bus service and its CLI client (Search1). zbus is pure Rust, talks to
# the session bus directly and has the blocking API the CLI wants.
zbus = "5"
# Fast byte-substring search: the index's matcher scans 200k names per query.
memchr = "2"
# NFKD for the diacritic-insensitive match (Resume matches Resume with an acute).
unicode-normalization = "0.1"
# Checksum of the index snapshot (corruption check; the file is also bounds-checked).
crc32fast = "1"
# Batch rename's find and replace. Matching runs in time linear in the name, so a
# hostile pattern cannot hang the window; the compiled size is capped as well.
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# Sizes, counts and offsets come from files, archives and servers: arithmetic
# on them traps on overflow instead of wrapping. (panic stays "unwind": a trap
# in a worker thread is contained and reported, an abort would end the program.)
overflow-checks = true
